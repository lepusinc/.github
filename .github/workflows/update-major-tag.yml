name: Update major tag

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  update-major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move major tag to current commit
        run: |
          MAJOR_TAG=$(echo "${{ github.ref_name }}" | grep -oP '^v\d+')
          git tag -f "$MAJOR_TAG" "${{ github.sha }}"
          git push origin "$MAJOR_TAG" --force
