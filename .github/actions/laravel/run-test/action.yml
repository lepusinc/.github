name: Run Laravel Tests
description: Setup Laravel test environment and run Pest tests

inputs:
  php:
    description: PHP version to use
    required: false
    default: '8.4'
  laravel:
    description: Laravel version constraint (e.g. "11.*")
    required: false
    default: '12.*'
  working-directory:
    description: Working directory to run Composer and Pest commands in
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Setup test environment
      uses: lepusinc/.github/.github/actions/laravel/setup-test@v1
      with:
        php: ${{ inputs.php }}
        laravel: ${{ inputs.laravel }}
        working-directory: ${{ inputs.working-directory }}

    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: vendor/bin/pest --parallel --no-progress
