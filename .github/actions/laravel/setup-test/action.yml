name: Setup Laravel Test Environment
description: Setup PHP, install Laravel dependencies, and install Composer packages

inputs:
  php:
    description: PHP version to use
    required: false
    default: '8.4'
  laravel:
    description: Laravel version constraint (e.g. "11.*")
    required: false
    default: '12.*'
  working-directory:
    description: Working directory to run Composer commands in
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Setup Composer
      uses: lepusinc/.github/.github/actions/php/setup-composer@v1
      with:
        php: ${{ inputs.php }}
        working-directory: ${{ inputs.working-directory }}

    - name: Install Laravel dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: composer require --dev "laravel/framework:${{ inputs.laravel }}" --no-interaction --no-update

    - name: Setup test environment
      uses: lepusinc/.github/.github/actions/php/setup-test@v1
      with:
        php: ${{ inputs.php }}
        working-directory: ${{ inputs.working-directory }}
