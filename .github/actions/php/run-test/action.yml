name: Run Tests
description: Run Pest tests

inputs:
  working-directory:
    description: Working directory to run Pest commands in
    required: false
    default: '.'
  annotations:
    description: Enable PR diff annotations via dorny/test-reporter (requires checks:write in calling workflow)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Register PHPUnit problem matcher
      shell: bash
      run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

    - name: Run tests
      id: run-tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        JUNIT_PATH=/tmp/pest-report.xml

        set -x
        vendor/bin/pest --parallel --no-progress --log-junit="$JUNIT_PATH" && EXIT_CODE=0 || EXIT_CODE=$?
        set +x

        echo "junit-path=$JUNIT_PATH" | tee -a "$GITHUB_STEP_SUMMARY" "$GITHUB_OUTPUT"
        exit "$EXIT_CODE"

    - name: Report test results
      uses: dorny/test-reporter@v3
      if: ${{ !cancelled() }}
      with:
        name: Pest Tests
        path: ${{ steps.run-tests.outputs.junit-path }}
        reporter: phpunit-junit
        fail-on-error: false
        use-actions-summary: ${{ inputs.annotations != 'true' }}
