name: Run Tests
description: Run Pest tests

inputs:
  working-directory:
    description: Working directory to run Pest commands in
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Register PHPUnit problem matcher
      shell: bash
      run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -x
        vendor/bin/pest --parallel --no-progress --log-junit=/tmp/pest-report.xml && EXIT_CODE=0 || EXIT_CODE=$?
        set +x

        {
          echo "### Test Results"
          php -r "
            \$xml = simplexml_load_file('/tmp/pest-report.xml');
            \$s = \$xml->testsuite->attributes();
            \$passed = (int)\$s['tests'] - (int)\$s['failures'] - (int)\$s['errors'] - (int)\$s['skipped'];
            echo '- Tests: '    . \$s['tests']    . PHP_EOL;
            echo '- Passed: '   . \$passed        . PHP_EOL;
            echo '- Failed: '   . \$s['failures'] . PHP_EOL;
            echo '- Skipped: '  . \$s['skipped']  . PHP_EOL;
          "
        } >> "$GITHUB_STEP_SUMMARY"

        exit "$EXIT_CODE"
