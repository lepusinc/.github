name: Run Tests
description: Run Pest tests

inputs:
  working-directory:
    description: Working directory to run Pest commands in
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "### Test Results" | tee -a "$GITHUB_STEP_SUMMARY"
        vendor/bin/pest --parallel --no-progress --colors=never | tee -a "$GITHUB_STEP_SUMMARY"
