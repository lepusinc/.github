name: Run Tests
description: Run Pest tests

inputs:
  working-directory:
    description: Working directory to run Pest commands in
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -x
        vendor/bin/pest --parallel --no-progress | tee /tmp/pest-output.txt && EXIT_CODE=0 || EXIT_CODE=$?
        set +x

        {
          echo "### Test Results"
          grep -E "Tests:" /tmp/pest-output.txt || true
        } >> "$GITHUB_STEP_SUMMARY"

        exit "$EXIT_CODE"
